<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raporty — EduResource Manager</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html">Zasoby</a>
    <a href="loans.html">Wypożyczenia</a>
    <a href="reports.html" class="is-active">Raporty</a>
    <span class="nav-user" id="nav-user"></span>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Raporty</h1>
    </div>

    <h2>Uszkodzone zasoby</h2>
    <table class="table">
      <thead>
        <tr>
          <th>Numer</th>
          <th>Nazwa</th>
          <th>Kategoria</th>
          <th>Lokalizacja</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="report-damaged-body">
        <tr>
          <td colspan="5" class="muted">Brak uszkodzonych zasobów.</td>
        </tr>
        
      </tbody>
    </table>

    <h2>Zasoby bez aktualnego testu</h2>
    <table class="table">
      <thead>
        <tr>
          <th>Numer</th>
          <th>Nazwa</th>
          <th>Kategoria</th>
          <th>Ostatni test</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="report-untested-body">
        <tr>
          <td colspan="5" class="muted">Brak zasobów bez aktualnego testu.</td>
        </tr>
        
      </tbody>
    </table>
    <p class="muted" style="margin-top: 8px;">Raport dostępny tylko dla administratora.</p>
  </div>
</body>
</html>
